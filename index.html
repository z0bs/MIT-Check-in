  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e2cba8;
      --ink: #1c1713;
      --muted: #6b6258;
      --gold: #c9a15b;
      --cream: #e8d7b8;
      --ok: #2d4a3c;
      --bad: #7a3228;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(28,23,19,.07) 1px, transparent 1.2px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      overflow-x: hidden;
    }
    .blob { position: fixed; pointer-events: none; z-index: 0; }
    .blob.a {
      width: 180px; height: 180px; right: -70px; top: 12%;
      background: #c9a15b; opacity: .28;
      border-radius: 62% 38% 55% 45% / 48% 58% 42% 52%;
    }
    .blob.b {
      width: 140px; height: 120px; left: -60px; bottom: 18%;
      background: #7a4a3a; opacity: .16;
      border-radius: 48% 52% 40% 60% / 60% 40% 60% 40%;
    }
    body::after {
      content: "";
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 22px; pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(28,23,19,.2) 0 3px, transparent 3px 12px);
    }
    .wrap {
      position: relative; z-index: 1;
      width: min(400px, calc(100% - 36px));
      text-align: center;
      margin: auto;
      padding: 8px 0 20px;
    }
    .page { display: none; }
    .page.on { display: block; }
    .day {
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 16px;
    }
    h1 {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 700; line-height: 1.2; margin: 0 0 12px;
    }
    h1 em { font-style: normal; box-shadow: inset 0 -8px 0 var(--gold); }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .wave { width: 72%; height: 22px; margin: 0 auto 28px; display: block; }
    .critters {
      display: grid; grid-template-columns: repeat(4, 1fr);
      max-width: 292px; margin: 0 auto 12px; min-height: 36px;
    }
    .critters span {
      font-size: 26px; opacity: 0;
      transform: translateY(8px) scale(.7); transition: .2s ease;
    }
    .critters span.on { opacity: 1; transform: none; }
    .pins {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; max-width: 292px; margin: 0 auto 28px;
    }
    .pins input, .code b {
      width: 100%; height: 64px;
      border: 1px solid rgba(28,23,19,.28);
      border-radius: 42% 38% 48% 36% / 44% 40% 50% 38%;
      background: var(--cream); color: var(--ink);
      text-align: center; font: 600 24px/64px Outfit, sans-serif;
      padding: 0; appearance: none; -webkit-appearance: none;
    }
    .pins input:focus, .field:focus { outline: 2px solid var(--gold); }
    label {
      display: block; font-size: 12px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin: 14px 0 6px;
    }
    .field {
      width: 100%; border: 1px solid rgba(28,23,19,.28);
      background: var(--cream); color: var(--ink);
      font: 500 16px Outfit, sans-serif; padding: 14px; border-radius: 16px;
      appearance: none; -webkit-appearance: none;
    }
    .field::placeholder { color: #b39a7a; opacity: 1; }
    .btn {
      border: 0; color: var(--cream);
      font: 600 13px Outfit, sans-serif; letter-spacing: .16em;
      text-transform: uppercase; padding: 15px 24px; border-radius: 999px;
      background:
        radial-gradient(circle at 18% 40%, rgba(255,255,255,.2) 0 4px, transparent 5px),
        radial-gradient(circle at 82% 60%, rgba(255,255,255,.14) 0 3px, transparent 4px),
        repeating-linear-gradient(-28deg, rgba(255,255,255,.08) 0 2px, transparent 2px 7px),
        #1c1713;
    }
    .wide { width: 100%; margin-top: 22px; }
    .slim { width: min(220px, 72%); }
    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .alt {
      display: block;
      width: 100%;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      background: none;
      border: 0;
      font-family: inherit;
      cursor: pointer;
    }
    .alt u { text-underline-offset: 3px; }
    .code { display: flex; justify-content: center; gap: 10px; margin: 24px auto; max-width: 292px; }
    .code b { display: grid; place-items: center; }
    .msg { margin-top: 16px; min-height: 1.2em; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .foot {
      position: relative; width: 100%; padding: 8px 0 34px; z-index: 2;
      text-align: center; font-size: 11px;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    }
    .form-left { text-align: left; }
    .form-left h1, .form-left .day, .form-left .sub, .form-left .alt { text-align: center; }
    .form-left label { text-align: left; }
    .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .foot small { display: block; margin-top: 4px; letter-spacing: .04em; font-size: 7px; opacity: .55; }
    /* Laptop: slight bump only, same layout */
    @media (min-width: 900px) {
      .wrap { width: 440px; }
      h1 { font-size: 44px; }
      .sub { font-size: 16px; }
      .day { font-size: 12px; }
      .pins, .critters, .code { max-width: 320px; }
    }
  </style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="wrap">
    <section class="page on" id="checkin">
      <p class="day" id="dayline">Wednesday 30 September</p>
      <h1>Wagwan, <em id="hello"></em>.</h1>
      <p class="sub">Enter your four digit check-in pin.</p>
      <svg class="wave" viewBox="0 0 320 28" fill="none" aria-hidden="true">
        <path d="M2 16 C 40 4, 70 24, 110 14 S 180 4, 220 16 S 280 26, 318 14" stroke="#1c1713" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 20 C 60 10, 100 24, 150 16 S 230 8, 304 18" stroke="#7a4a3a" stroke-width="1.1" opacity=".75"/>
      </svg>
      <form id="checkForm">
        <div class="critters" id="critters">
          <span>🐰</span><span>🐿️</span><span>🦦</span><span>🦊</span>
        </div>
        <div class="pins">
          <input inputmode="numeric" maxlength="1" required aria-label="Digit 1">
          <input inputmode="numeric" maxlength="1" required aria-label="Digit 2">
          <input inputmode="numeric" maxlength="1" required aria-label="Digit 3">
          <input inputmode="numeric" maxlength="1" required aria-label="Digit 4">
        </div>
        <div class="stack">
          <button class="btn slim" type="submit">MIT check-in</button>
          <button class="alt" type="button" data-go="register">New here? <u>Get a pin</u></button>
        </div>
        <p class="msg" id="checkMsg"></p>
      </form>
    </section>

    <section class="page form-left" id="register">
      <p class="day">MIVA MIT</p>
      <h1>Get a <em>pin</em>.</h1>
      <p class="sub">Name, email, phone number. Register to get a check-in pin.</p>
      <form id="regForm">
        <label for="name">Preferred name</label>
        <input class="field" id="name" required autocomplete="nickname" placeholder="Chikamso">
        <label for="email">School email</label>
        <input class="field" id="email" type="email" required autocomplete="email" placeholder="chikamso@miva.edu.ng">
        <label for="phone">Phone number</label>
        <input class="field" id="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="+234 800 001 2345">
        <p class="hint">Start with your country code.</p>
        <label for="gender">Gender</label>
        <select class="field" id="gender" required>
          <option value="" selected disabled>Select</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Mustard">Mustard</option>
        </select>
        <p class="msg" id="genderMsg"></p>
        <button class="btn wide" type="submit" id="regBtn">Register</button>
        <p class="msg" id="regMsg"></p>
        <button class="alt" type="button" data-go="checkin">Already have a pin? Check-in</button>
      </form>
    </section>

    <section class="page" id="pinpage">
      <p class="day">MIVA MIT</p>
      <h1>This is your <em>check-in pin</em>.</h1>
      <p class="sub" id="who"></p>
      <div class="code" id="code"></div>
      <p class="sub">Use this pin whenever you want to check-in.</p>
      <button class="btn slim" type="button" data-go="checkin">Go check-in</button>
    </section>
  </div>

  <p class="foot">Nigeria<small>© Zobs</small></p>

  <script>
    (function () {
      const hour = Number(new Intl.DateTimeFormat("en-GB", {
        hour: "numeric", hour12: false, timeZone: "Africa/Lagos"
      }).format(new Date()));
      let greet = "ụtụtụ ọma";
      if (hour >= 12 && hour < 17) greet = "ẹ káàsán";
      else if (hour >= 17) greet = "barka da yamma";
      document.getElementById("dayline").textContent = new Intl.DateTimeFormat("en-GB", {
        weekday: "long", day: "numeric", month: "long", timeZone: "Africa/Lagos"
      }).format(new Date());
      document.getElementById("hello").textContent = greet;

      const pages = ["checkin", "register", "pinpage"];
      function show(id) {
        pages.forEach((p) => document.getElementById(p).classList.toggle("on", p === id));
        window.scrollTo(0, 0);
      }
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", () => show(el.getAttribute("data-go")));
      });

      const boxes = [...document.querySelectorAll(".pins input")];
      const heads = [...document.querySelectorAll("#critters span")];
      boxes.forEach((box, i) => {
        box.addEventListener("input", () => {
          box.value = box.value.replace(/\D/g, "").slice(-1);
          heads[i].classList.toggle("on", !!box.value);
          if (box.value && boxes[i + 1]) boxes[i + 1].focus();
        });
        box.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !box.value && boxes[i - 1]) {
            heads[i].classList.remove("on");
            boxes[i - 1].focus();
          }
        });
      });
      document.getElementById("checkForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pin = boxes.map((b) => b.value).join("");
        const msg = document.getElementById("checkMsg");
        if (pin.length !== 4) {
          msg.className = "msg bad";
          msg.textContent = "Enter all four digits.";
          return;
        }
        if (!SCRIPT_URL) {
          msg.className = "msg bad";
          msg.textContent = "Sheet is not connected yet.";
          return;
        }
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "checkin", pin: pin })
          });
          const data = await res.json();
          if (!data.ok) {
            msg.className = "msg bad";
            msg.textContent = data.error || "Could not check in.";
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "Successfully checked in for today, we go again tomorrow.";
        } catch (err) {
          msg.className = "msg bad";
          msg.textContent = "Could not reach the Sheet.";
        }
      });
      const SCRIPT_URL = "https://mit-checkin.awzobs-38d.workers.dev";
      function cleanEmail(raw) {
        const email = String(raw || "").trim().toLowerCase();
        if (!/^[^\s@]+@miva\.edu\.ng$/.test(email)) return "";
        return email;
      }
      function cleanPhone(raw) {
        const s = String(raw || "").trim();
        if (!s) return "";
        const digits = s.replace(/\D/g, "");
        if (/^0[789][01]\d{8}$/.test(digits)) return "+234" + digits.slice(1);
        if (/^234[789][01]\d{8}$/.test(digits)) return "+" + digits;
        if (s.trim().startsWith("+") && digits.length >= 8 && digits.length <= 15) return "+" + digits;
        return "";
      }
      const gmsg = document.getElementById("genderMsg");
      document.getElementById("gender").addEventListener("change", () => {
        if (document.getElementById("gender").value === "Mustard") {
          gmsg.className = "msg bad";
          gmsg.textContent = "See as you dey do. Select your gender, joor.";
        } else {
          gmsg.className = "msg";
          gmsg.textContent = "";
        }
      });
      document.getElementById("regForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("regMsg");
        const btn = document.getElementById("regBtn");
        const name = document.getElementById("name").value.trim();
        const email = cleanEmail(document.getElementById("email").value);
        const phone = cleanPhone(document.getElementById("phone").value);
        const gender = document.getElementById("gender").value;
        if (name.length < 2) {
          msg.className = "msg bad";
          msg.textContent = "Enter your preferred name.";
          return;
        }
        if (!email) {
          msg.className = "msg bad";
          msg.textContent = "Use your school email, like chikamso@miva.edu.ng.";
          return;
        }
        if (!phone) {
          msg.className = "msg bad";
          msg.textContent = "Start with your country code, like +234 805 518 1101.";
          return;
        }
        if (gender === "Mustard") {
          gmsg.className = "msg bad";
          gmsg.textContent = "See as you dey do. Select your gender, joor.";
          return;
        }
        if (gender !== "Male" && gender !== "Female") {
          gmsg.className = "msg bad";
          gmsg.textContent = "Select male or female.";
          return;
        }
        document.getElementById("phone").value = phone;
        document.getElementById("email").value = email;
        if (!SCRIPT_URL) {
          msg.className = "msg bad";
          msg.textContent = "Sheet is not connected yet. Paste the Apps Script web app URL first.";
          return;
        }
        btn.disabled = true;
        msg.className = "msg";
        msg.textContent = "Saving...";
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "register", name: name, email: email, phone: phone, gender: gender })
          });
          const data = await res.json();
          if (!data.ok || !data.pin) {
            msg.className = "msg bad";
            msg.textContent = data.error || "Could not save. Try again.";
            btn.disabled = false;
            return;
          }
          document.getElementById("who").textContent = name ? name + ", keep this safe." : "Keep this.";
          document.getElementById("code").innerHTML = String(data.pin).split("").map((d) => "<b>" + d + "</b>").join("");
          show("pinpage");
        } catch (err) {
          msg.className = "msg bad";
          msg.textContent = "Could not reach the Sheet. Try again.";
        }
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
