<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>MIT check-in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1713'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23c9a15b'/%3E%3Cpath d='M11 16.5l3.2 3.2L21.5 12' fill='none' stroke='%231c1713' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e2cba8;
      --ink: #1c1713;
      --muted: #6b6258;
      --gold: #c9a15b;
      --cream: #e8d7b8;
      --ok: #2d4a3c;
      --bad: #7a3228;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(28,23,19,.07) 1px, transparent 1.2px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      overflow-x: hidden;
    }
    .blob { position: fixed; pointer-events: none; z-index: 0; }
    .blob.a {
      width: 180px; height: 180px; right: -70px; top: 12%;
      background: #c9a15b; opacity: .28;
      border-radius: 62% 38% 55% 45% / 48% 58% 42% 52%;
    }
    .blob.b {
      width: 140px; height: 120px; left: -60px; bottom: 18%;
      background: #7a4a3a; opacity: .16;
      border-radius: 48% 52% 40% 60% / 60% 40% 60% 40%;
    }
    body::after {
      content: "";
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 22px; pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(28,23,19,.2) 0 3px, transparent 3px 12px);
    }
    .wrap {
      position: relative; z-index: 1;
      width: min(400px, calc(100% - 36px));
      text-align: center;
      margin: auto;
      padding: 8px 0 20px;
    }
    .page { display: none; }
    .page.on { display: block; }
    #checkin { padding-top: 28px; }
    .day {
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 16px;
    }
    h1 {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 700; line-height: 1.2; margin: 0 0 12px;
    }
    h1 em { font-style: normal; box-shadow: inset 0 -8px 0 var(--gold); }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .critters {
      display: grid; grid-template-columns: repeat(4, 1fr);
      max-width: 292px; margin: 0 auto 12px; min-height: 36px;
    }
    .critters span {
      font-size: 26px; opacity: 0;
      transform: translateY(8px) scale(.7); transition: .2s ease;
    }
    .critters span.on { opacity: 1; transform: none; }
    .pins {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; max-width: 292px; margin: 0 auto 28px;
    }
    .pins input, .code b {
      width: 100%; height: 64px;
      border: 1px solid rgba(28,23,19,.28);
      border-radius: 42% 38% 48% 36% / 44% 40% 50% 38%;
      background: var(--cream); color: var(--ink);
      text-align: center; font: 600 24px/64px Outfit, sans-serif;
      padding: 0; appearance: none; -webkit-appearance: none;
    }
    .pins input:focus, .field:focus { outline: 2px solid var(--gold); }
    label {
      display: block; font-size: 12px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted); margin: 14px 0 6px;
    }
    .field {
      width: 100%; border: 1px solid rgba(28,23,19,.28);
      background: var(--cream); color: var(--ink);
      font: 500 16px Outfit, sans-serif; padding: 14px; border-radius: 16px;
      appearance: none; -webkit-appearance: none;
    }
    .field::placeholder { color: #b39a7a; opacity: 1; }
    textarea.field { min-height: 96px; resize: vertical; line-height: 1.4; }
    .feel-wrap { max-width: 292px; margin: 0 auto 18px; }
    #feelNote { text-align: left; margin-top: 6px; }
    #feelOpen { margin-top: 0; }
    .feel { display: none; margin-top: 22px; text-align: left; }
    .feel.on { display: block; }
    .feel p { margin: 0 0 8px; font-size: 15px; }
    .btn {
      border: 0; color: var(--cream);
      font: 600 13px Outfit, sans-serif; letter-spacing: .16em;
      text-transform: uppercase; padding: 15px 24px; border-radius: 999px;
      background:
        radial-gradient(circle at 18% 40%, rgba(255,255,255,.2) 0 4px, transparent 5px),
        radial-gradient(circle at 82% 60%, rgba(255,255,255,.14) 0 3px, transparent 4px),
        repeating-linear-gradient(-28deg, rgba(255,255,255,.08) 0 2px, transparent 2px 7px),
        #1c1713;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    }
    .btn:disabled { opacity: .72; cursor: wait; }
    .spin {
      width: 14px; height: 14px; flex: 0 0 14px;
      border: 2px solid rgba(232,215,184,.28);
      border-top-color: var(--cream);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn.busy .spin { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wide { width: 100%; margin-top: 22px; }
    .slim { width: min(220px, 72%); }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .alt {
      display: block; width: 100%; margin-top: 18px; color: var(--muted);
      font-size: 14px; text-align: center; text-decoration: none;
      background: none; border: 0; font-family: inherit; cursor: pointer;
    }
    .alt u { text-underline-offset: 3px; }
    .go-board {
      display: block; width: 100%; margin-top: 18px; background: none; border: 0; padding: 0;
      color: var(--muted); font: 400 14px Outfit, sans-serif; text-align: right;
      text-decoration: none; cursor: pointer;
    }
    .code { display: flex; justify-content: center; gap: 10px; margin: 24px auto; max-width: 292px; }
    .code b { display: grid; place-items: center; }
    .msg { margin-top: 8px; min-height: 0; }
    .msg:empty { display: none; margin: 0; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .foot {
      position: relative; width: 100%; padding: 8px 0 34px; z-index: 2;
      text-align: center; font-size: 11px;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    }
    .form-left { text-align: left; }
    .form-left h1, .form-left .day, .form-left .sub, .form-left .alt { text-align: center; }
    .form-left label { text-align: left; margin-top: 10px; }
    .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .foot small { display: block; margin-top: 4px; letter-spacing: .04em; font-size: 7px; opacity: .55; }
    #board { padding-top: 32px; }
    .viewport {
      width: 100%; max-width: 360px; margin-inline: auto;
      max-height: min(62vh, 520px); overflow-y: auto; overflow-x: hidden;
      padding-right: 10px; scrollbar-width: none;
    }
    .viewport:hover, .viewport.touched { scrollbar-width: thin; scrollbar-color: rgba(28,23,19,.22) transparent; }
    .viewport:active { cursor: grabbing; }
    .viewport::-webkit-scrollbar { width: 0; }
    .viewport:hover::-webkit-scrollbar, .viewport.touched::-webkit-scrollbar { width: 6px; }
    .viewport::-webkit-scrollbar-track { background: transparent; }
    .viewport::-webkit-scrollbar-thumb { background: rgba(28,23,19,.16); border-radius: 99px; }
    .viewport:hover::-webkit-scrollbar-thumb { background: rgba(28,23,19,.28); }
    .track { display: flex; flex-direction: column; }
    .row {
      display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 8px;
      padding: 8px 2px; border-bottom: 1px solid rgba(28,23,19,.2);
      opacity: 0; transform: translateY(14px); animation: in .55s ease forwards;
    }
    .row:last-child { border-bottom: 0; }
    @keyframes in { to { opacity: 1; transform: none; } }
    .rank {
      font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
      letter-spacing: 0; color: var(--ink); text-align: right; padding-right: 2px;
    }
    .who { text-align: left; }
    .name { font
